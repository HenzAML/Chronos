# Local Postgres for Chronos. Works the same on Windows, macOS and Linux.
#   docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: chronos
      POSTGRES_PASSWORD: chronos
      POSTGRES_DB: chronos
    ports:
      - "5432:5432"
    volumes:
      - chronos-db:/var/lib/postgresql/data

volumes:
  chronos-db:
